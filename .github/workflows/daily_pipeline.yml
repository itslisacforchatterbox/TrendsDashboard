name: Daily Trend Curation & Lifecycle Pipeline

on:
  schedule:
    # 1. Primary Schedule: 21:00 UTC (8:00 AM AEDT)
    - cron: '0 21 * * *'
    # 2. Catch-Up Schedule 1: 01:00 UTC (12:00 PM AEDT - 4 hours later)
    - cron: '0 1 * * *'
    # 3. Catch-Up Schedule 2: 05:00 UTC (4:00 PM AEDT - 8 hours later)
    - cron: '0 5 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate without writing to Google Sheets?'
        required: true
        type: boolean
        default: false
      force:
        description: 'Bypass idempotency gate and force curation even if today already ran?'
        required: true
        type: boolean
        default: false

jobs:
  curate-and-track:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Increased to 15m to safely accommodate 5m LLM generation windows

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-create Cache Directory
        run: |
          mkdir -p .cache
          if [ ! -f .cache/metric_snapshots.json ]; then
            echo "{}" > .cache/metric_snapshots.json
          fi

      - name: Restore Historical Metric Snapshots
        uses: actions/cache@v4
        with:
          path: .cache/metric_snapshots.json
          key: metric-snapshots-${{ github.run_id }}
          restore-keys: |
            metric-snapshots-

      - name: Execute Trend Pipeline
        env:
          GCP_SA_CREDENTIALS: ${{ secrets.GCP_SA_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_MODEL: 'gemini-flash-latest'
          GEMINI_TIMEOUT_SECONDS: '300' # 5-minute execution window
        run: |
          FLAGS="--refresh-cache"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi

          python -m src.pipeline $FLAGS

      - name: Persist Metric Snapshots for Next Run
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/metric_snapshots.json
          key: metric-snapshots-${{ github.run_id }}