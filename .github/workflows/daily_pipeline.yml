name: Daily Trend Curation & Lifecycle Pipeline

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate without writing to Google Sheets?'
        required: true
        type: boolean
        default: false

jobs:
  curate-and-track:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Hard safety cap: never burns more than 5 runner minutes

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-create Cache Directory
        run: |
          mkdir -p .cache
          if [ ! -f .cache/metric_snapshots.json ]; then
            echo "{}" > .cache/metric_snapshots.json
          fi

      - name: Restore Historical Metric Snapshots
        uses: actions/cache@v4
        with:
          path: .cache/metric_snapshots.json
          key: metric-snapshots-${{ github.run_id }}
          restore-keys: |
            metric-snapshots-

      - name: Execute Trend Pipeline
        env:
          GCP_SA_CREDENTIALS: ${{ secrets.GCP_SA_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_MODEL: 'gemini-flash-latest'
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Running in SIMULATION mode (--dry-run)..."
            python -m src.pipeline --refresh-cache --dry-run
          else
            echo "Running in LIVE PRODUCTION mode..."
            python -m src.pipeline --refresh-cache
          fi

      - name: Persist Metric Snapshots for Next Run
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/metric_snapshots.json
          key: metric-snapshots-${{ github.run_id }}